[project]
name = "ecommerce-mcp-automation"
version = "0.1.0"
description = "Sample Claude Code + MCP automation: Shopify + Meta Ads daily P&L / ad-performance reporting"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "openpyxl>=3.1",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
daily-report = "ecommerce_mcp.reporting.daily_report:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecommerce_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
